[package]
edition.workspace = true
license.workspace = true
name = "codex-wire-extensions"
version.workspace = true
description = "XLI wire-island types outside upstream codex-protocol (S-WI-03)"

[lib]
name = "codex_wire_extensions"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
ts-rs = { workspace = true, features = [
    "uuid-impl",
    "serde-json-impl",
    "no-serde-warnings",
] }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
