[package]
edition.workspace = true
license.workspace = true
name = "codex-vector-search"
version.workspace = true

[lib]
doctest = false
name = "codex_vector_search"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Engine
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync"] }
tracing = { workspace = true }
bincode = { workspace = true }
sha1 = { workspace = true }

# Embedding (always on — ONNX not an issue)
fastembed = { workspace = true }

# Text chunking (prose + markdown)
text-splitter = { workspace = true }

# Code chunking (tree-sitter)
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-java = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-json = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-toml-ng = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-yaml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }
