name: 'Sync Upstream (openai/codex)'

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream branch or tag to sync from (default: main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: 'Sync from upstream'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Configure git identity'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 'Add upstream remote'
        run: |
          git remote add upstream https://github.com/openai/codex.git || true
          git fetch upstream '${{ inputs.upstream_ref || 'main' }}' --no-tags

      - name: 'Check for new upstream commits'
        id: check
        run: |
          UPSTREAM_REF='${{ inputs.upstream_ref || 'main' }}'
          LOCAL_MERGE_BASE=$(git merge-base HEAD "upstream/${UPSTREAM_REF}" 2>/dev/null || echo "")
          UPSTREAM_HEAD=$(git rev-parse "upstream/${UPSTREAM_REF}")

          if [ -z "$LOCAL_MERGE_BASE" ]; then
            echo "No common ancestor found — first sync or diverged history."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "upstream_short=${UPSTREAM_HEAD:0:7}" >> "$GITHUB_OUTPUT"
          elif [ "$LOCAL_MERGE_BASE" = "$UPSTREAM_HEAD" ]; then
            echo "Already up to date with upstream/${UPSTREAM_REF}."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            COMMIT_COUNT=$(git rev-list --count "${LOCAL_MERGE_BASE}..${UPSTREAM_HEAD}")
            echo "Found ${COMMIT_COUNT} new upstream commit(s)."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "commit_count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"
            echo "upstream_short=${UPSTREAM_HEAD:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Merge upstream changes'
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        run: |
          UPSTREAM_REF='${{ inputs.upstream_ref || 'main' }}'
          BRANCH="chore/sync-upstream-$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          git checkout -b "${BRANCH}"

          if git merge "upstream/${UPSTREAM_REF}" --no-edit; then
            echo "merge_result=clean" >> "$GITHUB_OUTPUT"
          else
            echo "merge_result=conflict" >> "$GITHUB_OUTPUT"
            echo ""
            echo "============================================"
            echo "  MERGE CONFLICTS DETECTED"
            echo "============================================"
            echo ""
            echo "Conflicting files:"
            git diff --name-only --diff-filter=U
            echo ""
            git add -A
            git commit --no-verify -m "chore: merge upstream (${UPSTREAM_REF}, conflicts need resolution)"
          fi

      - name: 'Push sync branch'
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git push origin '${{ steps.merge.outputs.branch }}'

      - name: 'Create pull request'
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_REF='${{ inputs.upstream_ref || 'main' }}'
          COMMIT_COUNT='${{ steps.check.outputs.commit_count }}'
          UPSTREAM_SHORT='${{ steps.check.outputs.upstream_short }}'
          BRANCH='${{ steps.merge.outputs.branch }}'
          MERGE_RESULT='${{ steps.merge.outputs.merge_result }}'

          CONFLICT_WARNING=""
          if [ "${MERGE_RESULT}" = "conflict" ]; then
            CONFLICT_FILES=$(cd /tmp && git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=U 2>/dev/null || echo "(see branch)")
            CONFLICT_WARNING="
          > ⚠️ **Merge conflicts detected** — resolve conflict markers before merging.

          ```
          ${CONFLICT_FILES}
          ```"
          fi

          # Key upstream TUI changes for quick triage
          TUI_CHANGES=$(git log --oneline HEAD..upstream/${UPSTREAM_REF} -- codex-rs/tui/ 2>/dev/null | head -10 | sed 's/^/- /')

          BODY="## Upstream Sync

          This PR merges the latest changes from [`openai/codex@${UPSTREAM_REF}`](https://github.com/openai/codex/tree/${UPSTREAM_REF}).

          - **Upstream ref**: `${UPSTREAM_REF}` (${UPSTREAM_SHORT})
          - **New commits**: ${COMMIT_COUNT:-unknown}
          - **Merge result**: ${MERGE_RESULT}
          ${CONFLICT_WARNING}

          ### Key TUI changes
          ${TUI_CHANGES:-_No TUI changes in this sync._}

          ### Review checklist

          - [ ] Verify XLI-specific files preserved (`deploy/`, `app_brand.rs`, `messages_wire.rs`, `ontap_harness.rs`)
          - [ ] Run `cd codex-rs && cargo check --workspace` to validate build
          - [ ] Check for breaking changes in upstream commits
          - [ ] Resolve any `Cargo.lock` conflicts (regenerate with `cargo update --workspace`)"

          PR_TITLE="chore: sync upstream openai/codex (${COMMIT_COUNT:-?} commits, ${UPSTREAM_SHORT})"

          gh pr create 
            --base dev 
            --head "${BRANCH}" 
            --title "${PR_TITLE}" 
            --body "${BODY}" 
            --label "chore" 
            --label "upstream-sync" 2>/dev/null 
          || gh pr create 
            --base dev 
            --head "${BRANCH}" 
            --title "${PR_TITLE}" 
            --body "${BODY}"
