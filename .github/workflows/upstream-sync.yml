# Sync upstream openai/codex changes into dev
#
# Runs weekly and on manual trigger. Creates a PR if upstream has new commits.
# The PR targets dev (default branch) so you can review before merging.
name: Upstream Sync

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git and add upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/openai/codex.git || true
          git fetch upstream main --no-tags

      - name: Check for new commits
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Upstream is $BEHIND commits ahead"

      - name: Create sync branch and PR
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/upstream-sync-$(date +%Y%m%d-%H%M)"
          BEHIND=${{ steps.check.outputs.behind }}
          git checkout -b "$BRANCH"

          CONFLICTS=""
          if ! git merge upstream/main --no-edit; then
            # List conflicting files for the PR body
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U | head -20)
            CONFLICTS="⚠️ **Merge conflicts detected** — resolve before merging.

          ```
          $CONFLICT_FILES
          ```"
            git add -A
            git commit --no-verify -m "chore: merge upstream ($BEHIND commits, conflicts need resolution)"
          fi

          git push origin "$BRANCH"

          BODY="Automated sync of **$BEHIND commits** from [openai/codex](https://github.com/openai/codex).

          Key upstream changes:"
          BODY="$BODY
          $(git log --oneline HEAD..upstream/main -- codex-rs/tui/ | head -10 | sed 's/^/- /')"

          if [ -n "$CONFLICTS" ]; then
            BODY="$BODY

          $CONFLICTS"
          fi

          gh pr create 
            --title "chore: sync upstream openai/codex ($BEHIND commits)" 
            --body "$BODY" 
            --base dev 
            --head "$BRANCH"
